<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1820" viewBox="0 0 1920 1820" font-family="Segoe UI, Be Vietnam Pro, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 14 9" refX="13" refY="4.5" markerWidth="14" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L14,4.5 L0,9 Z" fill="#4F6B0A"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 14 9" refX="13" refY="4.5" markerWidth="14" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L14,4.5 L0,9 Z" fill="#7B9159"/>
    </marker>
    <style>
      .life { stroke: #A8B694; stroke-width: 1.8; stroke-dasharray: 8 8; }
      .pbox { fill: #FFFFFF; stroke: #6E8F00; stroke-width: 2; }
      .pbox-a { fill: #F1F6E4; stroke: #8CA463; stroke-width: 1.8; }
      .pt { font-size: 17px; font-weight: 700; fill: #1D2717; text-anchor: middle; }
      .ps { font-size: 13px; fill: #6B7568; text-anchor: middle; }
      .msg { fill: none; stroke: #4F6B0A; stroke-width: 2.4; marker-end: url(#arr); }
      .mr { fill: none; stroke: #7B9159; stroke-width: 2.4; stroke-dasharray: 10 7; marker-end: url(#arr-r); }
      .lab { font-size: 15px; font-weight: 600; fill: #2A3722; text-anchor: middle; paint-order: stroke; stroke: #F7F8F5; stroke-width: 7; stroke-linejoin: round; }
      .sub { font-size: 13.5px; fill: #46543A; text-anchor: middle; font-family: Consolas, monospace; paint-order: stroke; stroke: #F7F8F5; stroke-width: 7; stroke-linejoin: round; }
      .n { font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .alt { fill: #FBFCFA; stroke: #9BAE7A; stroke-width: 2; stroke-dasharray: 11 7; }
      .at { font-size: 14px; font-weight: 700; fill: #3E4E33; }
    </style>
  </defs>

  <rect width="1920" height="1820" fill="#F7F8F5"/>
  <text x="60" y="52" font-size="24" font-weight="700" fill="#1F2A18" letter-spacing="0.3">SƠ ĐỒ SEQUENCE — THANH TOÁN CHUYỂN KHOẢN &amp; ĐỐI SOÁT CASSO</text>
  <text x="60" y="80" font-size="13" fill="#7A8476">Luồng chính: Webhook CASSO tự động · Luồng phụ: xác nhận thủ công tại quầy</text>
  <text x="60" y="235" font-size="11" font-weight="700" fill="#8A957F">BƯỚC</text>

  <!-- Lifelines -->
  <g class="life">
    <path d="M165,205 L165,1665"/>
    <path d="M490,205 L490,1665"/>
    <path d="M815,205 L815,1665"/>
    <path d="M1140,205 L1140,1665"/>
    <path d="M1465,205 L1465,1665"/>
    <path d="M1770,205 L1770,1665"/>
  </g>

  <!-- Header các participant -->
  <rect class="pbox-a" x="45" y="118" width="240" height="84" rx="12"/>
  <circle cx="82" cy="152" r="10" fill="none" stroke="#6E8F00" stroke-width="2.2"/>
  <path d="M82,164 L82,181 M68,170 L96,170 M82,181 L71,193 M82,181 L93,193" fill="none" stroke="#6E8F00" stroke-width="2.2" stroke-linecap="round"/>
  <text x="160" y="153" class="pt">Hội viên</text>
  <text x="160" y="178" class="ps">MEMBER</text>

  <rect class="pbox" x="370" y="118" width="240" height="84" rx="12"/>
  <rect x="370" y="118" width="240" height="5" rx="2" fill="#B7FF00"/>
  <text x="490" y="153" class="pt">Frontend Next.js</text>
  <text x="490" y="178" class="ps">:3000</text>

  <rect class="pbox" x="695" y="118" width="240" height="84" rx="12"/>
  <rect x="695" y="118" width="240" height="5" rx="2" fill="#B7FF00"/>
  <text x="815" y="153" class="pt">Backend NestJS</text>
  <text x="815" y="178" class="ps">:3001</text>

  <rect class="pbox-a" x="1020" y="118" width="240" height="84" rx="12"/>
  <text x="1140" y="153" class="pt">Cổng đối soát</text>
  <text x="1140" y="178" class="ps">CASSO</text>

  <rect class="pbox" x="1345" y="118" width="240" height="84" rx="12"/>
  <rect x="1345" y="118" width="240" height="5" rx="2" fill="#B7FF00"/>
  <text x="1465" y="153" class="pt">SQL Server</text>
  <text x="1465" y="178" class="ps">gym_db</text>

  <rect class="pbox-a" x="1650" y="118" width="240" height="84" rx="12"/>
  <circle cx="1688" cy="152" r="10" fill="none" stroke="#6E8F00" stroke-width="2.2"/>
  <path d="M1688,164 L1688,181 M1674,170 L1702,170 M1688,181 L1677,193 M1688,181 L1699,193" fill="none" stroke="#6E8F00" stroke-width="2.2" stroke-linecap="round"/>
  <text x="1770" y="153" class="pt">Lễ tân / ADMIN</text>
  <text x="1770" y="178" class="ps">STAFF</text>

  <!-- Khung alt / else -->
  <rect class="alt" x="100" y="735" width="1790" height="925" rx="12"/>
  <path d="M100,1165 L1890,1165" stroke="#9BAE7A" stroke-width="1.8" stroke-dasharray="10 7"/>
  <rect x="100" y="735" width="640" height="36" rx="8" fill="#E9EDE4"/>
  <text x="118" y="761" class="at">alt — Đối soát tự động thành công (luồng chính)</text>
  <rect x="118" y="1147" width="650" height="36" rx="8" fill="#F7F8F5"/>
  <text x="134" y="1173" class="at">else — Đối soát thủ công tại quầy (tiền mặt / biên lai)</text>

  <!-- Mũi tên request -->
  <g class="msg">
    <path d="M165,260 L480,260"/>
    <path d="M490,338 L805,338"/>
    <path d="M815,416 L1455,416"/>
    <path d="M165,650 L225,650 L225,700 L165,700"/>
    <path d="M1140,810 L825,810"/>
    <path d="M815,888 L1455,888"/>
    <path d="M815,966 L1455,966"/>
    <path d="M165,1225 L1760,1225"/>
    <path d="M1770,1303 L500,1303"/>
    <path d="M490,1381 L805,1381"/>
    <path d="M815,1459 L1455,1459"/>
    <path d="M815,1537 L1455,1537"/>
  </g>
  <!-- Mũi tên response -->
  <g class="mr">
    <path d="M815,494 L500,494"/>
    <path d="M490,572 L175,572"/>
    <path d="M815,1044 L500,1044"/>
    <path d="M490,1122 L175,1122"/>
    <path d="M815,1615 L500,1615"/>
  </g>

  <!-- Nhãn message -->
  <g class="lab">
    <text x="322" y="250">Chọn gói &amp; bấm Thanh toán</text>
    <text x="648" y="328">POST /api/memberships/register</text>
    <text x="1135" y="406">Tạo Membership · Payment · Invoice</text>
    <text x="648" y="484">Trả PaymentCode + cú pháp QR</text>
    <text x="333" y="562">Hiện mã QR VietQR</text>
    <text x="322" y="641">Quét QR &amp; chuyển tiền</text>

    <text x="982" y="800">Webhook: khớp tài khoản, tiền, cú pháp</text>
    <text x="1135" y="878">Payment / Invoice → PAID</text>
    <text x="1135" y="956">Membership → ACTIVE · tính hạn thẻ</text>
    <text x="648" y="1034">WebSocket · PAYMENT_SUCCESS</text>
    <text x="333" y="1112">Vào trang thành công · xem hóa đơn</text>

    <text x="965" y="1215">Đưa tiền mặt / biên lai chuyển khoản</text>
    <text x="1130" y="1293">Xác nhận thu tiền tại quản trị</text>
    <text x="1135" y="1449">Payment → PAID · confirmedById = StaffId</text>
    <text x="1135" y="1527">Membership ACTIVE · Invoice PAID</text>
    <text x="648" y="1605">Báo thành công · cập nhật quỹ ca</text>
  </g>

  <!-- Nhãn phụ (mã / trạng thái) -->
  <g class="sub">
    <text x="648" y="348">{ packageId, method: BANK_TRANSFER }</text>
    <text x="1135" y="426">(PENDING · PENDING · DRAFT)</text>
    <text x="648" y="504">"GYM GÓI PAYMENT" + URL VietQR</text>
  </g>
  <text x="648" y="1372" class="sub">PATCH /api/payments/:id/confirm</text>

  <!-- Số bước -->
  <g>
    <circle cx="60" cy="260" r="15" fill="#5F7A12"/><text x="60" y="265" class="n">1</text>
    <circle cx="60" cy="338" r="15" fill="#5F7A12"/><text x="60" y="343" class="n">2</text>
    <circle cx="60" cy="416" r="15" fill="#5F7A12"/><text x="60" y="421" class="n">3</text>
    <circle cx="60" cy="494" r="15" fill="#5F7A12"/><text x="60" y="499" class="n">4</text>
    <circle cx="60" cy="572" r="15" fill="#5F7A12"/><text x="60" y="577" class="n">5</text>
    <circle cx="60" cy="650" r="15" fill="#5F7A12"/><text x="60" y="655" class="n">6</text>
    <circle cx="60" cy="810" r="15" fill="#5F7A12"/><text x="60" y="815" class="n">7</text>
    <circle cx="60" cy="888" r="15" fill="#5F7A12"/><text x="60" y="893" class="n">8</text>
    <circle cx="60" cy="966" r="15" fill="#5F7A12"/><text x="60" y="971" class="n">9</text>
    <circle cx="60" cy="1044" r="15" fill="#5F7A12"/><text x="60" y="1049" class="n">10</text>
    <circle cx="60" cy="1122" r="15" fill="#5F7A12"/><text x="60" y="1127" class="n">11</text>
    <circle cx="60" cy="1225" r="15" fill="#8CA463"/><text x="60" y="1230" class="n">12</text>
    <circle cx="60" cy="1303" r="15" fill="#8CA463"/><text x="60" y="1308" class="n">13</text>
    <circle cx="60" cy="1381" r="15" fill="#8CA463"/><text x="60" y="1386" class="n">14</text>
    <circle cx="60" cy="1459" r="15" fill="#8CA463"/><text x="60" y="1464" class="n">15</text>
    <circle cx="60" cy="1537" r="15" fill="#8CA463"/><text x="60" y="1542" class="n">16</text>
    <circle cx="60" cy="1615" r="15" fill="#8CA463"/><text x="60" y="1620" class="n">17</text>
  </g>

  <text x="960" y="1745" text-anchor="middle" font-size="18" font-style="italic" fill="#3C4738">Hình 4.4 — Sơ đồ Sequence luồng thanh toán chuyển khoản và đối soát tự động CASSO</text>
  <text x="960" y="1778" text-anchor="middle" font-size="13" fill="#7A8476">Mũi tên liền: yêu cầu · Mũi tên đứt nét: phản hồi · Khung đứt nét: nhánh alt / else</text>
</svg>
