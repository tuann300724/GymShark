<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1200" viewBox="0 0 1520 1200" font-family="Segoe UI, Be Vietnam Pro, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 12 8" refX="11" refY="4" markerWidth="12" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#5F7A12"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2A12" flood-opacity="0.10"/>
    </filter>
    <style>
      .edge { fill: none; stroke: #5F7A12; stroke-width: 2; marker-end: url(#arrow); }
      .edge-ws { fill: none; stroke: #7A8B5A; stroke-width: 2; stroke-dasharray: 9 7; marker-end: url(#arrow); }
      .elabel { font-size: 12px; fill: #46543A; paint-order: stroke; stroke: #F7F8F5; stroke-width: 5; stroke-linejoin: round; }
      .band-title { font-size: 14px; font-weight: 700; fill: #27321E; letter-spacing: 0.3px; }
      .band-count { font-size: 11px; fill: #7A8476; }
      .node-title { font-size: 16px; font-weight: 700; fill: #1D2717; }
      .node-sub { font-size: 12px; fill: #6B7568; }
      .accent { fill: #B7FF00; stroke: #6E8F00; stroke-width: 1; }
    </style>
  </defs>

  <!-- Nền -->
  <rect width="1520" height="1200" fill="#F7F8F5"/>

  <!-- Tiêu đề -->
  <text x="60" y="48" font-size="19" font-weight="700" fill="#1F2A18" letter-spacing="0.4">KIẾN TRÚC MODULE-BASED MONOLITH — GYMSHARK</text>
  <text x="60" y="70" font-size="11" fill="#7A8476">REST API + WebSocket · Prisma ORM · SQL Server 2022</text>

  <!-- ============ BAND 1: CLIENT ============ -->
  <rect x="60" y="110" width="1400" height="150" rx="14" fill="#FBFCFA" stroke="#D5DCCB"/>
  <rect x="60" y="110" width="1400" height="38" rx="14" fill="#E9EDE4"/>
  <rect x="60" y="134" width="1400" height="14" fill="#E9EDE4"/>
  <rect x="80" y="120" width="15" height="15" rx="3" class="accent"/>
  <text x="105" y="133" class="band-title">CLIENT LAYER · Trình duyệt Web</text>
  <text x="1440" y="133" text-anchor="end" class="band-count">2 thành phần</text>

  <!-- ============ BAND 2: PRESENTATION ============ -->
  <rect x="60" y="290" width="1400" height="180" rx="14" fill="#F4F6F1" stroke="#D5DCCB"/>
  <rect x="60" y="290" width="1400" height="38" rx="14" fill="#E9EDE4"/>
  <rect x="60" y="314" width="1400" height="14" fill="#E9EDE4"/>
  <rect x="80" y="300" width="15" height="15" rx="3" class="accent"/>
  <text x="105" y="313" class="band-title">PRESENTATION LAYER · NestJS Controllers &amp; DTOs</text>
  <text x="1440" y="313" text-anchor="end" class="band-count">3 thành phần</text>

  <!-- ============ BAND 3: APPLICATION ============ -->
  <rect x="60" y="500" width="1400" height="190" rx="14" fill="#FBFCFA" stroke="#D5DCCB"/>
  <rect x="60" y="500" width="1400" height="38" rx="14" fill="#E9EDE4"/>
  <rect x="60" y="524" width="1400" height="14" fill="#E9EDE4"/>
  <rect x="80" y="510" width="15" height="15" rx="3" class="accent"/>
  <text x="105" y="523" class="band-title">APPLICATION LAYER · NestJS Services</text>
  <text x="1440" y="523" text-anchor="end" class="band-count">3 thành phần</text>

  <!-- ============ BAND 4: DATA ACCESS ============ -->
  <rect x="60" y="720" width="1400" height="130" rx="14" fill="#F4F6F1" stroke="#D5DCCB"/>
  <rect x="60" y="720" width="1400" height="38" rx="14" fill="#E9EDE4"/>
  <rect x="60" y="744" width="1400" height="14" fill="#E9EDE4"/>
  <rect x="80" y="730" width="15" height="15" rx="3" class="accent"/>
  <text x="105" y="743" class="band-title">DATA ACCESS LAYER · Prisma ORM</text>
  <text x="1440" y="743" text-anchor="end" class="band-count">1 thành phần</text>

  <!-- ============ BAND 5: DATABASE ============ -->
  <rect x="60" y="880" width="1400" height="210" rx="14" fill="#FBFCFA" stroke="#D5DCCB"/>
  <rect x="60" y="880" width="1400" height="38" rx="14" fill="#E9EDE4"/>
  <rect x="60" y="904" width="1400" height="14" fill="#E9EDE4"/>
  <rect x="80" y="890" width="15" height="15" rx="3" class="accent"/>
  <text x="105" y="903" class="band-title">DATABASE LAYER</text>
  <text x="1440" y="903" text-anchor="end" class="band-count">2 thành phần</text>

  <!-- ============ CÁC NODE ============ -->
  <!-- Client -->
  <rect x="100" y="170" width="360" height="66" rx="10" fill="#FFFFFF" stroke="#C7CEC0" filter="url(#sh)"/>
  <rect x="100" y="182" width="4" height="42" rx="2" class="accent"/>
  <text x="122" y="197" class="node-title">Frontend Next.js 14</text>
  <text x="122" y="218" class="node-sub">App Router · TypeScript · Tailwind CSS</text>

  <rect x="800" y="170" width="420" height="66" rx="10" fill="#FFFFFF" stroke="#C7CEC0" filter="url(#sh)"/>
  <rect x="800" y="182" width="4" height="42" rx="2" class="accent"/>
  <text x="822" y="197" class="node-title">Camera Scanner / Web API</text>
  <text x="822" y="218" class="node-sub">getUserMedia · nhận diện khuôn mặt (client-side)</text>

  <!-- Presentation -->
  <rect x="100" y="350" width="360" height="96" rx="10" fill="#FFFFFF" stroke="#C7CEC0" filter="url(#sh)"/>
  <text x="122" y="392" class="node-title">JwtAuthGuard &amp; RolesGuard</text>
  <text x="122" y="414" class="node-sub">Xác thực JWT · phân quyền theo vai trò</text>

  <rect x="520" y="350" width="360" height="96" rx="10" fill="#FFFFFF" stroke="#C7CEC0" filter="url(#sh)"/>
  <text x="542" y="392" class="node-title">ValidationPipe &amp; DTOs</text>
  <text x="542" y="414" class="node-sub">class-validator · whitelist · transform</text>

  <rect x="950" y="350" width="400" height="96" rx="10" fill="#FFFFFF" stroke="#C7CEC0" filter="url(#sh)"/>
  <text x="972" y="392" class="node-title">Feature Controllers</text>
  <text x="972" y="414" class="node-sub">@Controller · REST endpoints (/api)</text>

  <!-- Application -->
  <rect x="90" y="560" width="330" height="96" rx="10" fill="#FFFFFF" stroke="#C7CEC0" filter="url(#sh)"/>
  <text x="112" y="602" class="node-title">AuditLogsService</text>
  <text x="112" y="624" class="node-sub">@Global · ghi vết kiểm toán</text>

  <rect x="520" y="560" width="380" height="96" rx="10" fill="#FFFFFF" stroke="#6E8F00" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="520" y="572" width="4" height="72" rx="2" class="accent"/>
  <text x="542" y="602" class="node-title">Business Services</text>
  <text x="542" y="624" class="node-sub">@Injectable · nghiệp vụ cốt lõi</text>

  <rect x="1030" y="560" width="370" height="96" rx="10" fill="#FFFFFF" stroke="#C7CEC0" filter="url(#sh)"/>
  <text x="1052" y="602" class="node-title">EventsGateway</text>
  <text x="1052" y="624" class="node-sub">Socket.IO · đẩy realtime metadata</text>

  <!-- Data access -->
  <rect x="520" y="776" width="380" height="54" rx="10" fill="#FFFFFF" stroke="#C7CEC0" filter="url(#sh)"/>
  <text x="542" y="808" class="node-title">PrismaService</text>
  <text x="660" y="808" class="node-sub">PrismaClient · mapped models</text>

  <!-- Database -->
  <path d="M150,950 A210,18 0 0 1 570,950 L570,1046 A210,18 0 0 1 150,1046 Z" fill="#FFFFFF" stroke="#C7CEC0" stroke-width="1.5" filter="url(#sh)"/>
  <ellipse cx="360" cy="950" rx="210" ry="18" fill="#F1F4EC" stroke="#C7CEC0" stroke-width="1.5"/>
  <text x="360" y="995" text-anchor="middle" class="node-title">Microsoft SQL Server 2022</text>
  <text x="360" y="1018" text-anchor="middle" class="node-sub">gym_db · TCP/IP 1433</text>

  <rect x="820" y="962" width="480" height="78" rx="10" fill="#FFFFFF" stroke="#C7CEC0" filter="url(#sh)"/>
  <text x="842" y="993" class="node-title">Views &amp; Stored Procedures</text>
  <text x="842" y="1015" class="node-sub">Beverages · tồn kho, định mức</text>

  <!-- ============ CÁC LUỒNG ============ -->
  <!-- FE -> Guard -->
  <path class="edge" d="M280,236 L280,350"/>
  <text x="293" y="297" class="elabel">HTTP / RESTful API</text>

  <!-- Guard -> DTO -> Controller -->
  <path class="edge" d="M460,398 L520,398"/>
  <path class="edge" d="M880,398 L950,398"/>

  <!-- Controller -> Service -->
  <path class="edge" d="M1150,446 L1150,486 L710,486 L710,560"/>

  <!-- Service -> Audit -->
  <path class="edge" d="M520,608 L420,608"/>

  <!-- Service -> Gateway -->
  <path class="edge" d="M900,608 L1030,608"/>
  <text x="965" y="580" text-anchor="middle" class="elabel" font-size="11">Phát metadata</text>
  <text x="965" y="594" text-anchor="middle" class="elabel" font-size="11">cập nhật</text>

  <!-- Gateway -> FE (WebSocket, đi vòng ngoài) -->
  <path class="edge-ws" d="M1400,608 L1480,608 L1480,82 L280,82 L280,170"/>
  <text x="1150" y="72" text-anchor="middle" class="elabel">WebSocket Event (realtime)</text>

  <!-- Service -> Prisma -->
  <path class="edge" d="M710,656 L710,776"/>

  <!-- Prisma -> SQL Server -->
  <path class="edge" d="M640,830 L400,950"/>
  <text x="466" y="888" class="elabel">T-SQL / TCP 1433</text>

  <!-- Service -> View/SP -->
  <path class="edge" d="M860,656 L1000,656 L1000,962"/>
  <text x="1014" y="792" class="elabel" font-size="11">Gọi SP /</text>
  <text x="1014" y="806" class="elabel" font-size="11">View</text>

  <!-- View/SP -> SQL Server -->
  <path class="edge" d="M820,1001 L570,1001"/>

  <!-- Chú thích -->
  <text x="760" y="1148" text-anchor="middle" font-size="15" font-style="italic" fill="#3C4738">Hình 2.1 — Sơ đồ luồng kiến trúc Module-based Monolith của hệ thống GymShark</text>
  <text x="760" y="1175" text-anchor="middle" font-size="11" fill="#7A8476">Đường liền: HTTP / gọi nội bộ · Đường đứt nét: sự kiện WebSocket</text>
</svg>
