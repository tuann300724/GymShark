      .nt { font-size: 12px; font-weight: 700; fill: #1D2717; }
      .ns { font-size: 10.5px; fill: #6B7568; }
      .flow { fill: none; stroke: #8FA470; stroke-width: 1.7; marker-end: url(#arrow); }
      .elabel { font-size: 10.5px; fill: #46543A; paint-order: stroke; stroke: #F7F8F5; stroke-width: 5; stroke-linejoin: round; }
      .rownum { font-size: 9px; fill: #9AA48F; }
