      <path d="M0,0 L12,4 L0,8 Z" fill="#6E8F00"/>
    </marker>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1B2A12" flood-opacity="0.09"/>
    </filter>
    <style>
      .lane-a { fill: #FBFCFA; }
      .lane-b { fill: #F4F6F1; }
      .lane-border { fill: none; stroke: #D5DCCB; stroke-width: 1.2; }
      .head { fill: #E9EDE4; }
      .lane-title { font-size: 12px; font-weight: 700; fill: #27321E; letter-spacing: 0.2px; }
      .lane-sub { font-size: 10.5px; fill: #7A8476; }
